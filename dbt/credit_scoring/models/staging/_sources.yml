version: 2

sources:
  - name: raw
    schema: raw
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 7, period: day}
        error_after: {count: 8, period: day}
    tables:
      - name: transactions
        description: One row per bank transaction, flattened from MongoDB account documents.
      - name: applications
      - name: outcomes
        description: Loan outcome reported by the lender 12 months after the application.
