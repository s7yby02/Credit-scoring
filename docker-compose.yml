services:
  mongo:
    image: mongo:8.0
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
    ports: ["5000:5000"]
    volumes: [mlflow-data:/mlflow]

  airflow:
    build: {context: ., dockerfile: airflow/Dockerfile}
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    ports: ["8080:8080"]
    env_file: .env
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PROJECT_DIR: /opt/project
      PYTHONPATH: /opt/project
      GOOGLE_APPLICATION_CREDENTIALS: /opt/secrets/gcp-key.json
      MONGO_URI: mongodb://mongo:27017
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./:/opt/project
      - ./secrets:/opt/secrets:ro
    depends_on: [mongo, mlflow]

  scorer:
    build: {context: ., dockerfile: serving/Dockerfile}
    profiles: [serving]   # start it once a champion model exists
    ports: ["8000:8000"]
    shm_size: 2gb         # Ray needs shared memory
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on: [mlflow]

volumes:
  mongo-data:
  mlflow-data:
